    <script>
      // webview 通过 acquireVsCodeApi 与宿主通信；预览里复刻真实握手：
      // webview 发 ready → 宿主回 state 快照
      window.__sent = [];
      // 正文/附件里的占位图（真实链路给的是服务端字节的 data URL）：一张内联 SVG，
      // 形状一致、看得见。放在函数外、`__buildState` 也能引用（`scripts/previewFixture.test.ts`
      // 会把 `__buildState` 抽出来在 Node 里求值，所以那个函数体**不能**引用 window）。
      var previewImageDataUrl =
        "data:image/svg+xml;base64," +
        btoa(
          '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200">' +
            '<rect width="360" height="200" fill="#2b3a2f"/>' +
            '<rect x="20" y="24" width="150" height="14" rx="7" fill="#8b949e"/>' +
            '<rect x="20" y="56" width="320" height="10" rx="5" fill="#5a6068"/>' +
            '<rect x="20" y="78" width="260" height="10" rx="5" fill="#5a6068"/>' +
            '<rect x="20" y="112" width="320" height="66" rx="8" fill="#1f2621"/>' +
            "</svg>",
        );
      // 正文里本地图片的解析（真实链路里由宿主读盘，白名单见 src/dsh/localImages.ts）。
      // 预览页没有宿主，这里回同一张占位图：用来验证「本地路径 → data URL 的替换与
      // 按会话缓存」确实工作，以及**没有响应时**（把这一段去掉）会落到「图片加载失败」。
      window.acquireVsCodeApi = function () {
        return {
          postMessage: function (message) {
            window.__sent.push(message);
            if (message && message.type === "ready") {
              // 真实宿主是异步回帧的（webview → 扩展进程 → postMessage 回来），
              // 这里用宏任务复刻同样的时序：effect 里的 ready 发完，脚本才继续定义 __buildState
              setTimeout(function () {
                window.__push({ type: "state", state: window.__buildState() });
              }, 0);
            }
            if (message && message.type === "resolveImages") {
              // 逐条「读盘」：`missing` 那条故意**不回**——真实宿主对工作目录里不存在
              // 的路径也不回表，界面就落到「图片加载失败」的降级（夹具里能看到它）
              var urls = {};
              (message.paths || []).forEach(function (path) {
                if (path.indexOf("missing") >= 0) return;
                urls[path] = previewImageDataUrl;
              });
              setTimeout(function () {
                window.__push({
                  type: "images/resolved",
                  requestId: message.requestId,
                  urls: urls,
                });
              }, 0);
            }
          },
          getState: function () {
            return undefined;
          },
          setState: function () {},
        };
      };
      // VS Code 的 webview 消息是 `JSON.stringify` 过的（实测扩展宿主里的 r8()），
      // 所以预览**也必须过一遍 JSON**：不过的话「值为 undefined 的键会消失」
      // 这类 bug 在预览里根本看不见（曾因此漏掉「目标条清不掉」，见 src/shared/wire.ts）。
      window.__push = function (frame) {
        window.dispatchEvent(new MessageEvent("message", { data: JSON.parse(JSON.stringify(frame)) }));
      };
      // 验证「清空目标」这条链路：宿主发的就是 `goal: null`（过线后 undefined 会消失）
      window.__clearGoal = function () {
        window.__push({ type: "patch", patch: { goal: null } });
      };
      // 面板数据按需推给界面，便于逐个预览
      window.__panels = function () {
        // 会话历史：含一条**分支**会话（`parentSessionId`）。字段形状来自真实
        // `session/list`（scripts/sessionListProbe.ts 实测）：fork 出来的子会话带
        // parentSessionId、`origin` 为空；标题继承源会话，所以界面必须靠标题前缀
        // 「分支: 」把它与源会话区分开——**同级显示，不缩进**（用户 2026-09-19 口径）。
        window.__push({
          type: "sessions",
          sessions: [
            { id: "s1", title: "重构 server 启动流程", updatedAt: Date.now() - 7200000, running: false },
            { id: "s1-fork", title: "重构 server 启动流程", updatedAt: Date.now() - 1800000, running: false, parentSessionId: "s1" },
            { id: "s2", title: "清理残留进程", updatedAt: Date.now() - 10800000, running: false },
            { id: "s3", title: "会话历史里的分支显示", updatedAt: Date.now() - 60000, running: true },
          ],
        });
        // 子代理目录：一条在跑（蓝点呼吸）、一条跑完了（`inactive` = **已完成**绿灯），
        // 一条只有投影（没有 `activity`，此时不画点、改显示模式）。
        window.__push({
          type: "subagents/list",
          entries: [
            { id: "sub-1", label: "调研 MCP 工具清单", activity: "running" },
            { id: "sub-2", label: "扫描未使用导出", activity: "inactive" },
            { id: "sub-3", label: "补齐投影的字段表", mode: "continuable" },
          ],
        });
        window.__push({
          type: "jobs/list",
          jobs: [
            { id: "j1", kind: "pwsh", label: "npm run typecheck", status: "running", startedAt: Date.now() - 42000 },
            // 子代理派发也进名册（真实形状），但面板不收它（2026-09-24 口径）——
            // 留着这条正是为了在预览里看着过滤生效：面板只应出现下面三条任务
            { id: "j2", kind: "subagent", label: "调研 MCP 工具清单", status: "running", startedAt: Date.now() - 90000 },
            { id: "j3", kind: "pwsh", label: "node build/smoke.mjs", status: "completed", startedAt: Date.now() - 600000, finishedAt: Date.now() - 545000, detail: "✓ 端到端通过" },
            { id: "j4", kind: "pwsh", label: "git push origin main", status: "failed", startedAt: Date.now() - 900000, finishedAt: Date.now() - 899000, detail: "fatal: could not read Username" },
          ],
        });
      };
      window.__composer = function () {
        // 待发消息队列：一条纯文本、一条只有附件（文本为空）、一条**插话发送**
        // （`placement: "steering"`，服务端顺序是提交先后，所以它排在最后——
        //   界面要把它显示到排队消息**上方**，见 `src/webview/queueOrder.ts`）
        window.__push({
          type: "patch",
          patch: {
            queueItems: [
              { id: "q1", text: "把入口文件里的重复初始化也一起去掉，顺带补一段说明注释", placement: "queued" },
              { id: "q2", text: "", hasMedia: true, attachments: 2, placement: "queued" },
              { id: "s1", text: "插一句：先别动配置读取那块", placement: "steering" },
            ],
          },
        });
        window.__push({
          type: "commands/list",
          commands: [
            { name: "plan", description: "进入计划模式" },
            { name: "compact", description: "压缩上下文" },
            { name: "goal", description: "设置目标" },
            { name: "permission", description: "切换权限模式", hint: "read-only | workspace-write | danger-full-access" },
            { name: "feedback", description: "记录反馈" },
            // 技能也进 `/` 候选（名字与 description 逐字取自真实 skills/list）。
            // 名字长 + 带「技能」标记，是「命令名必须完整、宽度不够先省描述」这条
            // 样式的压力样本：窄侧栏下曾经被压成 `/git…`。
            { name: "git-guardrails-claude-code", description: "Set up Claude Code hooks to block dangerous git commands (push, reset --hard, clean, branch -D, etc.) before they execute.", skill: true },
            { name: "transfer-read", description: "读取移交文档/接手继续任务。用户说「读取移交文档 xxx」「接手」「继续上次的任务」时调用。", skill: true },
          ],
        });
        window.__push({
          type: "files/list",
          query: "ctrl",
          items: [
            { path: "src/dsh/controller.ts", kind: "file" },
            { path: "src/dsh/client.ts", kind: "file" },
            { path: "src/webview/components", kind: "directory" },
          ],
        });
      };
      // 计划审阅**待处理**时的形态：把夹具里那张已答完的计划审阅翻回 `waiting`——
      // 此时它接管输入区（`resolveInteractions` 的选举：plan-review 优先级最高），
      // 卡是「warn 条带 + 内滚计划正文 + 底部决定行」，与记录态完全是两套排版。
      // 计划正文直接复用夹具里那份（不另写一份，免得两处漂移）。
      window.__planReview = function () {
        const state = window.__buildState();
        for (const message of state.messages) {
          for (const segment of message.segments) {
            if (segment.kind !== "question" || segment.id !== "ask2") continue;
            segment.question = Object.assign({}, segment.question, { state: "waiting" });
            delete segment.question.answers;
          }
        }
        window.__push({ type: "state", state: state });
      };
    </script>

    <script>
      const now = Date.now();
      const codeSample =
        "export function createServer(options) {\n" +
        "  const server = http.createServer((req, res) => {\n" +
        "    res.writeHead(200, { 'content-type': 'application/json' });\n" +
        "    res.end(JSON.stringify({ ok: true }));\n" +
        "  });\n" +
        "  return server;\n" +
        "}";

      window.__buildState = function () {
        // 用 ?locale=en 预览英文界面
        const locale = new URLSearchParams(location.search).get("locale") || "zh-cn";
        // 连接条的形态都能直接预览（`?conn=stopped&internal=1&external=reachable`）：
        // `conn=connecting` 就够看到「停止连接」+「查看日志」——连接中**只有**这两个按钮，
        // 目标写在文案里（`&target=internal&phase=starting` 可看"正在启动内部 DSH…"）。
        // 这些字段就是宿主真的会下发的那些（见 src/shared/chat.ts 的 ChatState
        // 与 src/dsh/controller.ts 的 connectionPatch）
        const query = new URLSearchParams(location.search);
        const connection = query.get("conn") || "ready";
        const flag = (name) => (query.get(name) === "1" ? true : undefined);
        // agent 预设目录（`agentPresets/list` 的 roster，形状照抄真实输出：随产品交付的四个
        // 是 `trust: "system"`、**不带 name/description**——展示名由客户端按语言给，
        // 见 src/webview/presetDisplay.ts；另加一条用户自己写的（带原文名字与描述）
        // 与一条没名字的，把三条展示路径都留在预览页）。
        // 主故事（会话已开始 → 工具栏那枚只读预设标签）与空态页（可点的下拉框）共用这一份。
        const presetRoster = {
          selectable: true,
          options: [
            { id: "standard", trust: "system", isDefault: true },
            { id: "ptc", trust: "system" },
            { id: "minimal", trust: "system" },
            { id: "cordis", trust: "system" },
            { id: "release-notes", trust: "user", name: "写发版说明", description: "只读仓库，产出 CHANGELOG 条目。" },
            { id: "bare", trust: "user" }
          ]
        };
        const state = {
          locale,
          connection,
          connectionDetail: query.get("detail") || undefined,
          internalRunning: flag("internal"),
          /** `external=reachable|unreachable`；不给就是 unconfigured（「连接外部 DSH」置灰）。 */
          externalState: query.get("external") || "unconfigured",
          externalAddress: query.get("url") || undefined,
          connectTarget: query.get("target") || undefined,
          connectPhase: query.get("phase") || undefined,
          needsToken: flag("token"),
          serverUrl: "http://127.0.0.1:3080",
          session: { id: "s1", title: "重构 server 启动流程", updatedAt: now, running: false },
          // 主故事是**已开始**的会话（有消息）→ 工具栏在思考强度与附件之间显示这枚
          // 只读预设标签；空态页（`?empty=1`）由下面的分支接管成可点的下拉框。
          agentPresets: presetRoster,
          agentPreset: "ptc",
          // 改动文件卡片（`workspace/changes`）：键是 `${sessionId}\u0000${seq}`
          // （见 src/shared/changesSummary.ts），值是 Host 那条认证路由回来的清单
          // （turn / files / total / added / deleted；binary 与 oversized 是可选标记）。
          // 7 个文件 > 折叠上限 3 → 能看到「+ 4 个文件」与展开/收起。
          changesSummaries: {
            "s1\u000041": {
              turn: 1,
              files: [
                { path: "src/server/index.ts", display: "src/server/index.ts", added: 42, deleted: 7 },
                { path: "src/config.ts", display: "src/config.ts", added: 12, deleted: 12 },
                { path: "docs/merge-plan.md", display: "docs/merge-plan.md", added: 88, deleted: 0 },
                { path: "assets/logo.png", display: "assets/logo.png", added: 0, deleted: 0, binary: true },
                { path: "D:/dev/app/fixtures/huge.json", display: "D:/dev/app/fixtures/huge.json", added: 0, deleted: 0, oversized: true },
                { path: "src/util/retry.ts", display: "src/util/retry.ts", added: 5, deleted: 1 },
                { path: "package.json", display: "package.json", added: 2, deleted: 1 }
              ],
              total: 9,
              added: 149,
              deleted: 21
            }
          },
          running: true,
          queue: 0,
          // 附件芯片的三种形态（对齐官方 FileCard）：图片（随消息走内容块）、

          // 引用都是正文里的 `@path` token（目录是 `@dir/`），不占附件位。
          // 失败那条故意**没有 path**（拖放 / 粘贴的字节附件就是这样）。
          attachments: [
            { id: "at-img", kind: "image", name: "shot.png", dataUrl: previewImageDataUrl, bytes: 15471 },
            { id: "at-up", kind: "file", path: "D:/dev/app/docs/spec.pdf", name: "docs/spec.pdf", upload: { status: "uploading", loaded: 42000, total: 180000 } },
            { id: "at-err", kind: "file", name: "big.bin", upload: { status: "error", message: "HTTP 413" } }
          ],
          draft: "把这两个文件的启动逻辑合并到一个入口",
          models: [
            {

            reasoningEffort: "high",
            contextWindow: 128000,
            // 与真实目录一致：deepseek-flash 是 4 档（Off/Low/High/Max）
            efforts: [
              { id: "off", name: "关闭" },
              { id: "low", name: "低" },
              { id: "high", name: "高" },
              { id: "max", name: "最高" }
            ]
          },
          permission: "workspace-write",
          planMode: false,
          // 问卷一次展开几道题（`dshChat.questionBatch`）：题目多于它时依次问答。
          // 夹具里的待答问卷是 2 题 → 走「一次展开」（默认阈值 3）。
          questionBatch: 3,
          // 连续过程折叠的阈值（`dshChat.turnProcessThreshold`）：默认 5。
          turnProcessThreshold: 5,
          // 界面字号（整数 px，`dshChat.fontSize`）：undefined = auto（配置为 0 或坏值）
          fontSizePx: undefined,
          // 「加载更早」：跟随窗口只带 60 条，更早的内容从没进过客户端
          hasMoreHistory: true,
          // 轮次大纲（`turnOutline` 投影）：右侧轮次横条的数据源，形状按契约

          // 轮号**从 1 起**，与真实服务端一致（harness 投影 spec 的第一轮就是
          // `turn/start {turn: 1}`）；0 号只可能是首个 turn/start 之前拼出来的
          // 幻影轮，见下面 `?rail=one` 那段。
          turnOutline: [
            { turn: 1, seq: 0, prompt: "把这两个文件的启动逻辑合并到一个入口，并去掉重复初始化。", response: "我看了两个文件，重复初始化的根因是端口和中间件被注册了两次。" },

            { turn: 3, seq: 24, prompt: "重构范围要覆盖到哪一层？", response: "" },
            { turn: 4, seq: 36, prompt: "按你选的方案改吧，顺便把回归测试补上。", response: "" }
          ],
          // 轨迹账本（宿主折叠后按需下发；形状 = `src/shared/trajectory.ts` 的
          // `TrajectoryModel`，内容对着本夹具的故事线手写，覆盖七种记录里的六种 +

          trajectory: {

                    ],

                    opensTurn: true,

            { turn: 5, seq: 311889, prompt: "先看看这两处初始化为什么会重复。", response: "端口和中间件各注册了一次。" },
            { turn: 6, seq: 315879, prompt: "把这两个文件的启动逻辑合并到一个入口，并去掉重复初始化。", response: "我看了两个文件，重复初始化的根因是端口和中间件被注册了两次。" },
            { turn: 7, seq: 318500, prompt: "那就按你的方案改，改完顺手跑一遍测试。", response: "改完了，两处初始化合并到 bootstrap，测试全绿。" }
          ];
          state.hasMoreHistory = true;
          // 主故事是「运行中」的会话（`state.running = true`），而生成中宿主会拒绝翻历史
          // （`turnRailNav` 的那条防御 + 按钮 disabled）——这一场要演的是**空闲时**点刻点，
          // 所以必须把它置回来，否则点击会被正确地拒掉，看不到加载与落位。
          state.running = false;
        }

        // 空态（`?empty=1`）：新会话的初始页面——一行能力提示 + 两行元信息
        // （工作目录、agent 预设）。主故事有消息，空态在预览页就永远看不到，
        // 而这两行正是「窄侧栏下英文会不会溢出」最容易出事的地方（长路径 +
        // 英文预设名 + 描述同处一行）。
        //
        // 工作目录那一行的三种形态各留一个入口：
        // - 默认（选过目录，可改）：显示路径 + 下箭头，点了才弹系统对话框；
        // - `?lock=1`（跟随 VS Code 打开的文件夹）：静态文字，没有下箭头；
        // - `?none=1`（没打开文件夹也没选过目录）：占位「未选择工作区」——**不是**
        //   拿宿主的 cwd（VS Code 安装路径）冒充一个目录（用户 2026-09-22 口径）。
        if (query.get("empty") === "1") {
          state.messages = [];
          state.session = null;
          state.workspace = query.get("none") === "1"
            ? { path: "", locked: false }
            : {
                path: query.get("lock") === "1" ? "D:\\dev\\dsh-chat" : "C:\\Users\\me\\Projects\\dsh-chat",
                locked: query.get("lock") === "1"
              };
          state.agentPresets = presetRoster;
          state.agentPreset = "ptc";
        }

        // 正在看子代理（`?subagent=1`）：会话级切换后的形态——标题旁是
        // 「父会话标题 / 当前子代理标题 ⇄」的面包屑，`subagent` 带父目录快照
        // （兄弟行含自己）。`&readonly=1` 再叠一次性模式：输入区整个换成只读说明。
        // 目录与标题取自 `window.__panels()` 那份夹具的同一批名字（不是另编的）。
        if (query.get("subagent") === "1") {
          const parentEntries = [
            { id: "sub-1", label: "调研 MCP 工具清单", mode: "continuable", activity: "running" },
            { id: "sub-2", label: "扫描未使用导出", mode: "one-shot", activity: "inactive" },
            { id: "sub-3", label: "补齐投影的字段表", mode: "continuable", activity: "inactive" }
          ];
          const oneShot = query.get("readonly") === "1";
          const current = oneShot ? parentEntries[1] : parentEntries[0];
          state.session = { id: current.id, title: current.label, updatedAt: now - 30000, running: current.activity === "running" };
          state.subagent = {
            parentSessionId: "s1",
            parentTitle: "把这两个文件的启动逻辑合并到一个入口",
            mode: oneShot ? "one-shot" : "continuable",
            parentEntries
          };
          state.subagentEntries = oneShot ? [] : [
            { id: "sub-1-1", label: "展开分支里的标准库调用", mode: "continuable", activity: "inactive" }
          ];
          state.running = current.activity === "running";
          if (oneShot) {
            state.messages = [
              { id: "u:1", role: "user", ts: now - 40000, text: "扫描未使用导出。", segments: [] },
              {
                id: "a:1",
                role: "assistant",
                ts: now - 30000,
                model: "DeepSeek-V4-Pro",
                segments: [{ id: "t1", kind: "text", text: "共发现 3 处未使用导出，已列出在下面。" }]
              }
            ];
          }
        }
        return state;
      };
      // 文件芯片的种类表（`patch.fileKinds`）：形状与真实宿主一致（键 = 芯片上的
      // 原样路径，值 = "new" | "edited" | "deleted"，见 src/dsh/fileChange.ts）。
      // 夹具按「一条 edited / 一条 new / 一条 deleted」铺开，三种记号一次看全。
      window.__fileKinds = function () {
        window.__push({
          type: "patch",
          patch: {
            fileKinds: {
              "D:/dev/app/src/server/index.ts": "edited",
              "D:/dev/app/src/config.ts": "edited",
              "D:/dev/app/src/bootstrap.ts": "new",
              "D:/dev/app/src/client.ts": "edited",
              "D:/dev/app/src/auth/middleware.ts": "edited",
              "D:/dev/app/src/routes/api.ts": "edited",
              "D:/dev/app/src/util/retry.ts": "edited",
              "D:/dev/app/package.json": "edited",
              "D:/dev/app/docs/merge-plan.md": "edited",
              "D:/dev/app/docs/merge-plan.md.bak": "deleted"
            }
          }
        });
      };
      // 开机后跟着 state 快照推一次：预览页默认就能看到记号
      setTimeout(function () {
        window.__fileKinds();
      }, 60);
    </script>
  </body>
