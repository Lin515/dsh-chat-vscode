    <script>
      // webview 通过 acquireVsCodeApi 与宿主通信；预览里复刻真实握手：
      // webview 发 ready → 宿主回 state 快照
      window.__sent = [];
      window.acquireVsCodeApi = function () {
        return {
          postMessage: function (message) {
            window.__sent.push(message);
            if (message && message.type === "ready") {
              // 真实宿主是异步回帧的（webview → 扩展进程 → postMessage 回来），
              // 这里用宏任务复刻同样的时序：effect 里的 ready 发完，脚本才继续定义 __buildState
              setTimeout(function () {
                window.__push({ type: "state", state: window.__buildState() });
              }, 0);
            }
          },
          getState: function () {
            return undefined;
          },
          setState: function () {},
        };
      };
      // VS Code 的 webview 消息是 `JSON.stringify` 过的（实测扩展宿主里的 r8()），
      // 所以预览**也必须过一遍 JSON**：不过的话「值为 undefined 的键会消失」
      // 这类 bug 在预览里根本看不见（曾因此漏掉「目标条清不掉」，见 src/shared/wire.ts）。
      window.__push = function (frame) {
        window.dispatchEvent(new MessageEvent("message", { data: JSON.parse(JSON.stringify(frame)) }));
      };
      // 验证「清空目标」这条链路：宿主发的就是 `goal: null`（过线后 undefined 会消失）
      window.__clearGoal = function () {
        window.__push({ type: "patch", patch: { goal: null } });
      };
      // 面板数据按需推给界面，便于逐个预览
      window.__panels = function () {
        // 会话历史：含一条**分支**会话（`parentSessionId` + `depth: 1`）。
        // 字段形状来自真实 `session/list`（scripts/sessionListProbe.ts 实测）：
        // fork 出来的子会话带 parentSessionId、`origin` 为空；标题继承源会话，
        // 所以界面必须靠缩进把两条区分开。
        window.__push({
          type: "sessions",
          sessions: [
            { id: "s1", title: "重构 server 启动流程", updatedAt: Date.now() - 7200000, running: false, depth: 0 },
            { id: "s1-fork", title: "重构 server 启动流程", updatedAt: Date.now() - 1800000, running: false, parentSessionId: "s1", depth: 1 },

            { id: "s3", title: "会话历史里的分支显示", updatedAt: Date.now() - 60000, running: true, depth: 0 },
          ],
        });
        window.__push({
          type: "subagents/list",
          parentAvailable: true,
          entries: [
            { id: "sub-1", label: "调研 MCP 工具清单", activity: "running" },
            { id: "sub-2", label: "扫描未使用导出", activity: "inactive" },
          ],
        });
        window.__push({
          type: "jobs/list",
          jobs: [
            { id: "j1", kind: "pwsh", label: "npm run typecheck", status: "running", startedAt: Date.now() - 42000 },
            { id: "j2", kind: "subagent", label: "调研 MCP 工具清单", status: "running", startedAt: Date.now() - 90000 },
            { id: "j3", kind: "pwsh", label: "node build/smoke.mjs", status: "completed", startedAt: Date.now() - 600000, finishedAt: Date.now() - 545000, detail: "✓ 端到端通过" },
            { id: "j4", kind: "pwsh", label: "git push origin main", status: "failed", startedAt: Date.now() - 900000, finishedAt: Date.now() - 899000, detail: "fatal: could not read Username" },
          ],
        });
      };
      window.__composer = function () {
        // 待发消息队列：一条纯文本、一条只有附件（文本为空）、一条**插话发送**
        // （`placement: "steering"`，服务端顺序是提交先后，所以它排在最后——
        //   界面要把它显示到排队消息**上方**，见 `src/webview/queueOrder.ts`）
        window.__push({
          type: "patch",
          patch: {
            queueItems: [
              { id: "q1", text: "把入口文件里的重复初始化也一起去掉，顺带补一段说明注释", placement: "queued" },
              { id: "q2", text: "", hasMedia: true, attachments: 2, placement: "queued" },
              { id: "s1", text: "插一句：先别动配置读取那块", placement: "steering" },
            ],
          },
        });
        window.__push({
          type: "commands/list",
          commands: [
            { name: "plan", description: "进入计划模式" },
            { name: "compact", description: "压缩上下文" },
            { name: "goal", description: "设置目标" },
            { name: "permission", description: "切换权限模式", hint: "read-only | workspace-write | danger-full-access" },
            { name: "feedback", description: "记录反馈" },
            // 技能也进 `/` 候选（名字与 description 逐字取自真实 skills/list）。
            // 名字长 + 带「技能」标记，是「命令名必须完整、宽度不够先省描述」这条
            // 样式的压力样本：窄侧栏下曾经被压成 `/git…`。
            { name: "git-guardrails-claude-code", description: "Set up Claude Code hooks to block dangerous git commands (push, reset --hard, clean, branch -D, etc.) before they execute.", skill: true },

        window.__push({

            { path: "src/dsh/client.ts", kind: "file" },
            { path: "src/webview/components", kind: "directory" },
          ],
        });

      // 文件芯片的种类表（`patch.fileKinds`）：形状与真实宿主一致（键 = 芯片上的
      // 原样路径，值 = "new" | "edited" | "deleted"，见 src/dsh/fileChange.ts）。
      // 夹具按「一条 edited / 一条 new / 一条 deleted」铺开，三种记号一次看全。
      window.__fileKinds = function () {
        window.__push({
          type: "patch",
          patch: {
            fileKinds: {
              "D:/dev/app/src/server/index.ts": "edited",
              "D:/dev/app/src/config.ts": "edited",
              "D:/dev/app/src/bootstrap.ts": "new",
              "D:/dev/app/src/client.ts": "edited",
              "D:/dev/app/src/auth/middleware.ts": "edited",
              "D:/dev/app/src/routes/api.ts": "edited",
              "D:/dev/app/src/util/retry.ts": "edited",
              "D:/dev/app/package.json": "edited",
              "D:/dev/app/docs/merge-plan.md": "edited",
              "D:/dev/app/docs/merge-plan.md.bak": "deleted"
            }
          }
        });
      };
      // 开机后跟着 state 快照推一次：预览页默认就能看到记号
      setTimeout(function () {
        window.__fileKinds();
      }, 60);
    </script>
  </body>
</html>
